298" y="398" class="s" text-anchor="middle">LOSO</text><text x="1446" y="398" class="s" text-anchor="middle">new order</text><line x1="1290.0" y1="446.0" x2="1322.3" y2="469.5" stroke="#c3cad5" stroke-width="2"/><line x1="1290.0" y1="446.0" x2="1310.0" y2="507.5" stroke="#c3cad5" stroke-width="2"/><line x1="1290.0" y1="446.0" x2="1270.0" y2="507.5" stroke="#c3cad5" stroke-width="2"/><line x1="1290.0" y1="446.0" x2="1257.7" y2="469.5" stroke="#eb6834" stroke-width="5"/><line x1="1322.3" y1="469.5" x2="1310.0" y2="507.5" stroke="#c3cad5" stroke-width="2"/><line x1="1322.3" y1="469.5" x2="1270.0" y2="507.5" stroke="#c3cad5" stroke-width="2"/><line x1="1322.3" y1="469.5" x2="1257.7" y2="469.5" stroke="#c3cad5" stroke-width="2"/><line x1="1310.0" y1="507.5" x2="1270.0" y2="507.5" stroke="#c3cad5" stroke-width="2"/><line x1="1310.0" y1="507.5" x2="1257.7" y2="469.5" stroke="#c3cad5" stroke-width="2"/><line x1="1270.0" y1="507.5" x2="1257.7" y2="469.5" stroke="#c3cad5" stroke-width="2"/><circle cx="1290.0" cy="446.0" r="7" fill="#16202e"/><circle cx="1322.3" cy="469.5" r="7" fill="#16202e"/><circle cx="1310.0" cy="507.5" r="7" fill="#16202e"/><circle cx="1270.0" cy="507.5" r="7" fill="#16202e"/><circle cx="1257.7" cy="469.5" r="7" fill="#16202e"/><text x="1346" y="464" class="m" style="font-weight:650;fill:#16202e">Heart stops following</text><text x="1346" y="486" class="m" style="font-weight:650;fill:#16202e">movement under stress</text><text x="1346" y="510" class="m">15 of 15 people</text><rect x="48" y="588" width="1504" height="72" rx="14" fill="#16202e"/><text x="80" y="632" style="font-size:20px;font-weight:700;fill:#fff">For VR training:</text><g transform="translate(270,604) scale(0.82)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="14" r="8"/><path d="M8,44 C8,28 40,28 40,44"/><path d="M36,6 L44,6 M40,2 L40,10"/></g><text x="322" y="632" style="font-size:19px;fill:#e6eaf0">works on a new traine