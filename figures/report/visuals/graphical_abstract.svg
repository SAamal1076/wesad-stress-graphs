" style="font-size:14px;fill:#8b95a5">›</text><rect x="257.6" y="358" width="55.2" height="42" rx="8" fill="#eb6834" opacity="0.16"/><rect x="257.6" y="358" width="6" height="42" rx="3" fill="#eb6834"/><text x="288.2" y="383.6" text-anchor="middle" style="font-size:13px;fill:#16202e;font-weight:700">Stress</text><text x="315.8" y="384.0" text-anchor="middle" style="font-size:14px;fill:#8b95a5">›</text><rect x="318.8" y="358" width="55.2" height="42" rx="8" fill="#eda100" opacity="0.16"/><rect x="318.8" y="358" width="6" height="42" rx="3" fill="#eda100"/><text x="349.4" y="383.6" text-anchor="middle" style="font-size:13px;fill:#16202e;font-weight:500">Calm</text><text x="74" y="438" class="b" style="font-size:16px">Order B, 7 people</text><rect x="74.0" y="450" width="55.2" height="42" rx="8" fill="#2a78d6" opacity="0.16"/><rect x="74.0" y="450" width="6" height="42" rx="3" fill="#2a78d6"/><text x="104.6" y="475.6" text-anchor="middle" style="font-size:13px;fill:#16202e;font-weight:500">Rest</text><text x="132.2" y="476.0" text-anchor="middle" style="font-size:14px;fill:#8b95a5">›</text><rect x="135.2" y="450" width="55.2" height="42" rx="8" fill="#eb6834" opacity="0.16"/><rect x="135.2" y="450" width="6" height="42" rx="3" fill="#eb6834"/><text x="165.8" y="475.6" text-anchor="middle" style="font-size:13px;fill:#16202e;font-weight:700">Stress</text><text x="193.4" y="476.0" text-anchor="middle" style="font-size:14px;fill:#8b95a5">›</text><rect x="196.4" y="450" width="55.2" height="42" rx="8" fill="#eda100" opacity="0.16"/><rect x="196.4" y="450" width="6" height="42" rx="3" fill="#eda100"/><text x="227.0" y="475.6" text-anchor="middle" style="font-size:13px;fill:#16202e;font-weight:500">Calm</text><text x="254.6" y="476.0" text-anchor="middle" style="font-size:14px;fill:#8b95a5">›</text><rect x="257.6" y="450" width="55.2" height="42" rx="8" fill="#1baf7a" opacity="0.16"/><rect x="257.6" y="450" width="6" height="42" rx="3" fill="#1baf7a"/><text x="288.2" y="475.6" text-anchor="middle" style="font-size:13px;fill:#16202e;font-weight:500">Fun</text><text x="315.8" y="476.0" text-anchor="middle" style="font-size:14px;fill:#8b95a5">›</text><rect x="318.8" y="450" width="55.2" height="42" rx="8" fill="#eda100" opacity="0.16"/><rect x="318.8" y="450" width="6" height="42" rx="3" fill="#eda100"/><text x="349.4" y="475.6" text-anchor="middle" style="font-size:13px;fill:#16202e;font-weight:500">Calm</text><text x="74" y="528" class="s">Stress test early or late in the session</text><g transform="translate(570.0,202) scale(1.9)" fill="none" stroke="#16202e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M24,13 L24,24 L32,29"/><path d="M6,42 L42,6" stroke="none" stroke-width="3.4"/></g><text x="616.0" y="338" text-anchor="middle" class="m">Minutes since the start, nothing else:</text><text x="616.0" y="394" text-anchor="middle" style="font-family:Inter Display,Inter,sans-serif;font-size:56px;font-weight:700;fill:#eb6834">95.7%</text><text x="616.0" y="424" text-anchor="middle" class="m">accuracy on new people</text><text x="466" y="475" class="s">Original paper</text><rect x="584" y="460" width="100.4" height="20" rx="4" fill="#7d8aa3"/><text x="692.4" y="476" class="s" style="font-weight:650;fill:#16202e">93.1%</text><text x="466" y="515" class="s">Clock only</text><rect x="584" y="500" width="132.7" height="20" rx="4" fill="#eb6834"/><text x="724.7" y="516" class="s" style="font-weight:650;fill:#16202e">95.7%</text><text x="858" y="220" class="b" style="font-size:16px">Train on order A</text><circle cx="872" cy="246" r="12" fill="#16202e"/><circle cx="906" cy="246" r="12" fill="#16202e"/><circle cx="940" cy="246" r="12" fill="#16202e"/><circle cx="974" cy="246" r="12" fill="#16202e"/><circle cx="1008" cy="246" r="12" fill="#16202e"/><circle cx="1042" cy="246" r="12" fill="#16202e"/><circle cx="1076" cy="246" r="12" fill="#16202e"/><circle cx="1110" cy="246" r="12" fill="#162