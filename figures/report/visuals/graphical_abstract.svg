</style><rect width="1600" height="680" fill="#f7f8fa"/><text x="48" y="62" style="font-family:Lora,serif;font-size:36px;font-weight:600;fill:#16202e">Stress detection that still works when the schedule changes</text><text x="48" y="94" class="m">Open WESAD dataset: 15 people, chest and wrist wearables, a lab stress test. Every number below comes from that data.</text><rect x="48" y="124" width="352" height="430" rx="18" fill="#fff" stroke="#dce1e8" stroke-width="1.5"/><circle cx="82" cy="162" r="17" fill="#16202e"/><text x="82" y="168" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#fff">1</text><text x="110" y="169" class="b" style="font-size:21px">The data</text><path d="M406,339.0 L432,339.0" stroke="#8b95a5" stroke-width="3" marker-end="url(#gaar)"/><rect x="440" y="124" width="352" height="430" rx="18" fill="#fff" stroke="#dce1e8" stroke-width="1.5"/><circle cx="474" cy="162" r="17" fill="#eb6834"/><text x="474" y="168" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#fff">2</text><text x="502" y="169" class="b" style="font-size:21px">A hidden shortcut</text><path d="M798,339.0 L824,339.0" stroke="#8b95a5" stroke-width="3" marker-end="url(#gaar)"/><rect x="832" y="124" width="352" height="430" rx="18" fill="#fff" stroke="#dce1e8" stroke-width="1.5"/><circle cx="866" cy="162" r="17" fill="#16202e"/><text x="866" y="168" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#fff">3</text><text x="894" y="169" class="b" style="font-size:21px">A fair test</text><path d="M1190,339.0 L1216,339.0" stroke="#8b95a5" stroke-width="3" marker-end="url(#gaar)"/><rect x="1224" y="124" width="352" height="430" rx="18" fill="#fff" stroke="#dce1e8" stroke-width="1.5"/><circle cx="1258" cy="162" r="17" fill="#16202e"/><text x="1258" y="168" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#fff">4</text><text x="1286" y="169" class="b" style="font-size:21px">The result</text><defs><marker id="gaar" viewBox="0 0 10 10" ref