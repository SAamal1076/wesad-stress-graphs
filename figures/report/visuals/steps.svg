</style><circle cx="140.8" cy="58" r="50" fill="#fff" stroke="#dce1e8" stroke-width="2"/><g transform="translate(110.80000000000001,28) scale(1.25)" fill="none" stroke="#16202e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2,26 L10,26 L14,14 L19,38 L24,8 L29,32 L33,26 L46,26"/><path d="M8,4 L8,46 M40,4 L40,46" stroke-dasharray="3 4"/></g><path d="M204.8,58 L358.40000000000003,58" stroke="#8b95a5" stroke-width="2.5" marker-end="url(#ar2)"/><text x="140.8" y="140" class="b" text-anchor="middle" style="font-size:20px;fill:#16202e">1. Cut</text><text x="140.8" y="168" class="m" text-anchor="middle">One-minute windows,</text><text x="140.8" y="192" class="m" text-anchor="middle">each inside one condition</text><circle cx="422.40000000000003" cy="58" r="50" fill="#fff" stroke="#dce1e8" stroke-width="2"/><g transform="translate(392.40000000000003,28) scale(1.25)" fill="none" stroke="#16202e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6,44 L6,30 M16,44 L16,18 M26,44 L26,24 M36,44 L36,10 M2,44 L46,44"/></g><path d="M486.40000000000003,58 L640.0,58" stroke="#8b95a5" stroke-width="2.5" marker-end="url(#ar2)"/><text x="422.40000000000003" y="140" class="b" text-anchor="middle" style="font-size:20px;fill:#16202e">2. Describe</text><text x="422.40000000000003" y="168" class="m" text-anchor="middle">38 body measures + a graph</text><text x="422.40000000000003" y="192" class="m" text-anchor="middle">of how signals move together</text><circle cx="704.0" cy="58" r="50" fill="#fff" stroke="#dce1e8" stroke-width="2"/><g transform="translate(674.0,28) scale(1.25)" fill="none" stroke="#16202e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M24,13 L24,24 L32,29"/><path d="M6,42 L42,6" stroke="#eb6834" stroke-width="3.4"/></g><path d="M768.0,58 L921.6,58" stroke="#8b95a5" stroke-width="2.5" marker-end="url(#ar2)"/><text x="704.0" y="140" class="b" text-anchor="middle" style="font-size:20px;fill:#eb6834">3. Remove the clock</text><text x="704.0" y="168" class="m" text-anchor="middle">Drop 4 measures that drift</text><text x="704.0" y="192" class="m" text-anchor="middle">with time (temperature, sweat level)</text><circle cx="985.6000000000001" cy="58" r="50" fill="#fff" stroke="#dce1e8" stroke-width="2"/><g transform="translate(955.6000000000001,28) scale(1.25)" fill="none" stroke="#16202e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2,44 L46,44 M2,4 L2,44"/><path d="M4,40 C18,40 18,8 44,8" stroke-width="3"/></g><path d="M1049.6000000000001,58 L1203.2000000000003,58" stroke="#8b95a5" stroke-width="2.5" marker-end="url(#ar2)"/><text x="985.6000000000001" y="140" class="b" text-anchor="middle" style="font-size:20px;fill:#16202e">4. Classify</text><text x="985.6000000000001" y="168" class="m" text-anchor="middle">Simple, readable model:</text><text x="985.6000000000001" y="192" class="m" text-anchor="middle">p = σ(w·z + b)</text><circle cx="1267.2" cy="58" r="50" fill="#fff" stroke="#dce1e8" stroke-width="2"/><g transform="translate(1237.2,28) scale(1.25)" fill="none" stroke="#16202e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="32" rx="4"/><rect x="26" y="8" width="20" height="32" rx="4" stroke="#eb6834"/><path d="M12,18 L12,30 M36,18 L36,30" /></g><text x="1267.2" y="140" class="b" text-anchor="middle" style="font-size:20px;fill:#16202e">5. Test fairly</text><text x="1267.2" y="168" class="m" text-anchor="middle">New people and a new</text><text x="1267.2" y="192" class="m" text-anchor="middle">schedule, never seen in training</text><defs><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b95a5"/></marker></defs></svg>